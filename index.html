<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Universal Gatekeeper Script
        if (localStorage.getItem('excellent_auth') !== 'true') {
            document.addEventListener("DOMContentLoaded", function() {
                document.body.style.visibility = "hidden"; 
                document.body.style.overflow = "hidden";
                
                const lockDiv = document.createElement('div');
                lockDiv.style.cssText = "position:fixed; top:0; left:0; width:100vw; height:100vh; background:#0f172a; z-index:9999999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; font-family:'Inter', sans-serif; visibility:visible;";
                
                lockDiv.innerHTML = `
                    <div style="background:#1e293b; padding:40px; border-radius:12px; text-align:center; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid #334155; max-width:90%; width:400px;">
                        <h2 style="margin-bottom:10px; color:#10b981; font-size:1.8rem;">Restricted Access 🛡️</h2>
                        <p style="color:#94a3b8; margin-bottom:25px; line-height:1.5;">This portal is strictly for registered students of Excellent Institute.</p>
                        
                        <input type="email" id="authEmail" placeholder="Enter Authorized Email" style="width:100%; padding:14px; margin-bottom:20px; border-radius:8px; border:2px solid #334155; background:#0f172a; color:white; text-align:center; outline:none; font-size:1.1rem; transition: border-color 0.2s;">
                        
                        <button onclick="verifyAccess()" style="width:100%; padding:14px; background:#10b981; color:white; border:none; border-radius:8px; font-size:1.1rem; font-weight:bold; cursor:pointer; transition: background 0.2s;">
                            Verify Connection
                        </button>
                        
                        <div id="authError" style="display:none; background-color: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 15px; border-radius: 8px; color:#fca5a5; margin-top:20px; font-weight:600; line-height:1.5;">
                            ❌ Access Denied.<br><br>Please use the Excellent Institute mobile APK to view this content.
                        </div>
                    </div>
                `;
                document.documentElement.appendChild(lockDiv);

                window.verifyAccess = function() {
                    const emailInput = document.getElementById('authEmail').value.toLowerCase().trim();
                    const inputBox = document.getElementById('authEmail');
                    
                    if (emailInput === 'excellent.institut@gmail.com') { 
                        localStorage.setItem('excellent_auth', 'true');
                        lockDiv.remove();
                        document.body.style.visibility = "visible";
                        document.body.style.overflow = "auto";
                    } else {
                        document.getElementById('authError').style.display = "block";
                        inputBox.style.borderColor = "#ef4444";
                    }
                };
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excellent Institute - Photoshop & Image Editing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* PHOTOSHOP Deep Blue Palette */
            --primary: #0369a1; 
            --primary-light: #e0f2fe;
            --accent: #0284c7;
            --surface: #ffffff;
            --background: #f8fafc; 
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius: 12px;
        }
        
        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            letter-spacing: -0.01em;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #7dd3fc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 24px; background-color: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
            z-index: 10; box-shadow: var(--shadow-sm);
        }

        .brand { display: flex; align-items: center; gap: 15px; }

        .toggle-btn {
            background: none; border: none; color: var(--primary); cursor: pointer;
            padding: 6px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; transition: background 0.2s ease;
        }
        .toggle-btn:hover { background-color: var(--primary-light); }

        .brand img.logo {
            width: 35px; height: 35px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--accent); box-shadow: var(--shadow-sm); cursor: pointer;
        }

        .brand h2 { margin: 0; color: var(--primary); font-size: 1.3rem; font-weight: 700; cursor: pointer; }

        .action-btns button {
            background-color: var(--surface); color: var(--text-main);
            border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-family: inherit; transition: all 0.2s ease;
            box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 8px;
        }
        .action-btns button:hover { background-color: var(--background); border-color: var(--text-muted); transform: translateY(-1px); }

        /* Main Container */
        .main-container { display: flex; flex: 1; overflow: hidden; }

        .sidebar {
            width: 300px; background-color: var(--surface); border-right: 1px solid var(--border);
            padding: 24px 16px; overflow-y: auto; overflow-x: hidden; flex-shrink: 0;
            display: flex; flex-direction: column; gap: 6px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 1;
        }
        .sidebar.collapsed { width: 0; padding: 24px 0; border-right: none; opacity: 0; }
        
        .nav-label {
            font-size: 0.75rem; text-transform: uppercase; font-weight: 700;
            color: var(--text-muted); margin-bottom: 10px; padding-left: 12px; white-space: nowrap;
        }

        .nav-btn {
            display: flex; align-items: center; width: 100%; padding: 12px 16px;
            border: none; background: none; text-align: left; font-size: 0.95rem;
            font-weight: 600; color: var(--text-muted); cursor: pointer;
            border-radius: var(--radius); transition: all 0.2s ease; white-space: nowrap;
        }
        .nav-btn:hover { background-color: var(--background); color: var(--text-main); }
        .nav-btn.active { background-color: var(--primary-light); color: var(--primary); }

        /* Content Area */
        .content-area {
            flex: 1; padding: 40px 60px; overflow-y: auto; background-color: transparent; 
            cursor: grab; scroll-behavior: smooth;
        }
        .content-area:active { cursor: grabbing; } 

        .content-wrapper {
            max-width: 1200px; margin: 0 auto; background: var(--surface);
            padding: 40px 50px; border-radius: var(--radius); box-shadow: var(--shadow-md); 
            animation: fadeIn 0.4s ease forwards; position: relative; z-index: 2; transition: max-width 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .note-section { pointer-events: none; }
        .note-section.allow-select { pointer-events: auto; }

        .note-section h1 { color: var(--text-main); font-size: 2.2rem; font-weight: 800; margin: 0 0 30px 0; border-bottom: 2px solid var(--border); padding-bottom: 15px;}
        .note-section h3 { color: var(--primary); font-size: 1.4rem; margin-top: 40px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .note-section p, .note-section li { line-height: 1.7; font-size: 1.1rem; color: #334155; }

        .shortcut-box {
            background-color: var(--primary-light);
            border-left: 4px solid var(--accent);
            padding: 12px 16px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            color: var(--primary);
        }
        
        kbd {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-bottom: 3px solid #94a3b8;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.9em;
            font-family: 'Courier New', Courier, monospace;
            color: #1e293b;
            font-weight: 700;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .note-section img {
            max-width: 600px; width: 100%; height: auto; border: 1px solid var(--border);
            border-radius: 8px; margin: 25px auto 30px auto; display: block; box-shadow: var(--shadow-sm);
            cursor: zoom-in; pointer-events: auto; transition: transform 0.2s;
        }
        .note-section img:hover { transform: scale(1.01); box-shadow: var(--shadow-md); }
        .img-caption { font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 30px; }

        /* Dashboard */
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 2.5rem; color: var(--text-main); margin-bottom: 10px; }
        .hero p { color: var(--text-muted); font-size: 1.1rem; }
        
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; pointer-events: auto; }
        .module-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; cursor: pointer; transition: all 0.3s ease; box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: flex-start;
        }
        .module-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        .card-icon {
            font-size: 2rem; margin-bottom: 15px; background: var(--primary-light);
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px;
        }
        .module-card h3 { margin: 0 0 10px 0; color: var(--text-main); font-size: 1.2rem; }
        .module-card span { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

        /* Lightbox & Watermark */
        #lightbox {
            display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px);
            overflow: auto; text-align: center; padding: 50px 20px;
        }
        #lightbox img { 
            display: inline-block; vertical-align: middle;
            max-width: 90%; max-height: 85vh; border-radius: 8px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            cursor: zoom-in; transition: all 0.3s ease; transform-origin: top center;
        }
        #lightbox img.zoomed { max-width: none; max-height: none; width: 140%; cursor: zoom-out; margin-bottom: 50px; }

        .watermark-bg {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 45vw; max-width: 400px; opacity: 0.04; pointer-events: none; 
            z-index: 9999; border-radius: 50%; object-fit: cover;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; overflow-x: auto; padding: 12px; gap: 10px;}
            .sidebar.collapsed { height: 0; padding: 0; border: none; opacity: 0; }
            .nav-label { display: none; }
            .nav-btn { white-space: nowrap; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); }
            .content-area { padding: 20px 15px; }
            .content-wrapper { padding: 25px 20px; }
            .watermark-bg { width: 70vw; }
        }

        @media print {
            html, body, .main-container, .content-area, .content-wrapper { height: auto !important; overflow: visible !important; position: static !important; display: block !important; background-color: transparent !important; }
            .sidebar, .header, .action-btns, .dashboard-grid, .hero, .toggle-btn { display: none !important; }
            .content-area { padding: 0 !important; margin: 0 !important; border: none !important; }
            .content-wrapper { margin: 0 !important; padding: 0 !important; box-shadow: none !important; border: none !important; max-width: 100% !important; }
            .note-section { pointer-events: auto !important; }
            .watermark-bg { display: block !important; position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; opacity: 0.08 !important; width: 60vw !important; max-width: 600px !important; z-index: -1 !important; }
            h1 { page-break-before: always; color: #000; padding-top: 20px; }
            h1:first-of-type { page-break-before: avoid; padding-top: 0; } 
            h3 { color: #000; border-bottom: 1px solid #ccc; page-break-after: avoid; }
            img { page-break-inside: avoid; border: none; max-width: 100% !important; margin: 15px 0 !important; }
            p, ul, li, .shortcut-box { page-break-inside: avoid; }
            .shortcut-box { border: 1px solid #000 !important; background: transparent !important; color: #000 !important; }
            kbd { border: 1px solid #000 !important; box-shadow: none !important; background: transparent !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            <button id="sidebar-toggle" class="toggle-btn" onclick="toggleSidebar()" title="Hide/Show Menu">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <img src="institute_logo.jpeg" alt="Excellent Institute Logo" class="logo" id="mainLogo" onclick="loadDashboard()"> 
            <h2 onclick="loadDashboard()">Excellent Institute</h2>
        </div>
        <div class="action-btns">
            <button onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </div>

    <img src="institute_logo.jpeg" alt="Watermark" class="watermark-bg" id="watermarkLogo">

    <div class="main-container">
        <div class="sidebar" id="main-sidebar">
            <div class="nav-label">Course Chapters</div>
            <button class="nav-btn active" onclick="loadDashboard()" id="home-btn">🏠 Dashboard</button>
            <div id="nav-container" style="display: flex; flex-direction: column; gap: 6px;"></div>
        </div>

        <div class="content-area" id="content-display"></div>
    </div>

    <div id="lightbox" onclick="closeLightbox(event)">
        <img id="lightbox-img" src="" alt="Enlarged view" onclick="toggleZoom(event)">
    </div>

    <script src="photoshop-data.js"></script>
    
    <script>
        const navContainer = document.getElementById('nav-container');
        const contentDisplay = document.getElementById('content-display');
        const sidebar = document.getElementById('main-sidebar');

        // Global DCA Lock Variable
        let isDcaUnlocked = false; 

        function initApp() {
            if (typeof photoshopBookData === 'undefined') {
                contentDisplay.innerHTML = `<h2 style="color:red; text-align:center; padding:50px;">Awaiting Data File...</h2>`;
                return;
            }
            photoshopBookData.forEach((chapter, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn note-nav-btn';
                
                // Everything is DCA locked
                let displayIcon = isDcaUnlocked ? '🎨' : '🔒';
                btn.innerHTML = `${displayIcon} ${chapter.title.split(':')[0]}`; 
                
                btn.onclick = () => loadContent(index, btn);
                navContainer.appendChild(btn);
            });
            loadEntryScreen(); 
        }

        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        function loadEntryScreen() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            let html = `
            <div class="content-wrapper allow-select" style="text-align: center; margin-top: 5vh;">
                <h1 style="font-size: 2.8rem; color: var(--primary); margin-bottom: 10px;">Photoshop & Image Editing</h1>
                <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px;">DCA Exclusive: Master document digitization and professional photo editing.</p>
                
                <img src="images/ps-preview.jpg" alt="App Preview" style="width: 100%; max-width: 500px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); border: 2px solid var(--border); margin-bottom: 40px; cursor: zoom-in;" onclick="openLightbox(this.src)">
                <br>
                
                <button onclick="loadDashboard()" style="background-color: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: var(--shadow-md);">
                    Enter Studio Portal 🚀
                </button>
            </div>`;
            
            contentDisplay.innerHTML = html;
            contentDisplay.scrollTop = 0;
        }

        function loadDashboard() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('home-btn').classList.add('active');

            let html = `
            <div class="content-wrapper allow-select">
                <div class="hero">
                    <h1>Adobe Photoshop 7.0 Studio</h1>
                    <p>Learn to crop, clean, and master digital image manipulation.</p>
                </div>
                <div class="dashboard-grid">`;
            
            const icons = ['🖼️', '✂️', '📸', '🖌️'];
            if (typeof photoshopBookData !== 'undefined') {
                photoshopBookData.forEach((chapter, index) => {
                    let isLocked = !isDcaUnlocked;
                    let icon = isLocked ? '🔒' : icons[index % icons.length];
                    let lockedText = isLocked ? '<span style="color:#ef4444; font-size:0.9rem;"> (DCA Locked)</span>' : '';
                    
                    html += `
                        <div class="module-card" onclick="document.querySelectorAll('.note-nav-btn')[${index}].click()">
                            <div class="card-icon">${icon}</div>
                            <h3>${chapter.title}${lockedText}</h3>
                            <span>${chapter.topics.length} Design Topics</span>
                        </div>`;
                });
            }

            html += `</div></div>`;
            contentDisplay.innerHTML = html;
            contentDisplay.scrollTop = 0;
        }

        function loadContent(index, clickedBtn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(clickedBtn) clickedBtn.classList.add('active');

            // --- DCA Lock for All Chapters ---
            if (!isDcaUnlocked) {
                let lockHtml = `
                <div class="content-wrapper allow-select" style="text-align: center; padding: 80px 20px;">
                    <div style="font-size: 5rem; margin-bottom: 10px;">🔒</div>
                    <h2 style="color: var(--primary); font-size: 2rem;">DCA Module Locked</h2>
                    <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 25px;">Please enter the DCA password to access professional Photoshop tutorials.</p>
                    
                    <input type="password" id="dcaPass" placeholder="Password" style="padding: 12px; font-size: 1.2rem; border: 2px dashed var(--primary); border-radius: 8px; width: 100%; max-width: 250px; text-align: center; outline: none;">
                    <br><br>
                    
                    <button onclick="checkDcaPassword(${index})" style="background-color: var(--primary); color: white; border: none; padding: 12px 40px; font-size: 1.1rem; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: var(--shadow-md);">
                        Unlock 🔓
                    </button>
                    
                    <p id="wrong-dca-msg" style="color: #ef4444; font-weight: bold; margin-top: 15px; display: none;">❌ Incorrect Password!</p>
                </div>`;
                
                contentDisplay.innerHTML = lockHtml;
                contentDisplay.scrollTop = 0;
                
                if(window.innerWidth <= 768) sidebar.classList.add('collapsed');
                return; 
            }

            // Normal Content Loading
            const chapter = photoshopBookData[index];

            let htmlContent = `
            <div class="content-wrapper">
                <div class="note-section allow-select">
                    <h1>${chapter.title}</h1>`;
            
            chapter.topics.forEach(topic => {
                htmlContent += `<h3>${topic.heading}</h3>`;
                htmlContent += `<p>${topic.text}</p>`;
                
                if(topic.shortcut) {
                    htmlContent += `
                    <div class="shortcut-box">
                        <strong>⌨️ Shortcut / Tip:</strong> <span><kbd>${topic.shortcut}</kbd></span>
                    </div>`;
                }

                if(topic.imgSrc) {
                    htmlContent += `<img src="${topic.imgSrc}" alt="${topic.heading}" onclick="openLightbox(this.src)">`;
                    htmlContent += `<div class="img-caption">Figure: ${topic.heading}</div>`;
                }
            });
            htmlContent += `</div></div>`;
            
            contentDisplay.innerHTML = htmlContent;
            contentDisplay.scrollTop = 0;
            
            if(window.innerWidth <= 768) {
                sidebar.classList.add('collapsed');
            }
        }

        function checkDcaPassword(index) {
            const input = document.getElementById('dcaPass').value.trim().toUpperCase(); 
            if (input === "DCA") {
                isDcaUnlocked = true; 
                
                // Instantly turn all 🔒 into 🎨 in the sidebar
                document.querySelectorAll('.note-nav-btn').forEach((btn, i) => {
                    btn.innerHTML = btn.innerHTML.replace('🔒', '🎨');
                });
                
                const btn = document.querySelectorAll('.note-nav-btn')[index];
                loadContent(index, btn); 
            } else {
                document.getElementById('wrong-dca-msg').style.display = 'block'; 
            }
        }

        // Zoomable Lightbox Logic
        function openLightbox(src) {
            const img = document.getElementById('lightbox-img');
            img.src = src;
            img.classList.remove('zoomed');
            document.getElementById('lightbox').style.display = 'block'; 
        }

        function closeLightbox(e) {
            if (e.target.id === 'lightbox') {
                document.getElementById('lightbox').style.display = 'none';
            }
        }

        function toggleZoom(e) {
            e.stopPropagation(); 
            const img = e.target;
            img.classList.toggle('zoomed');
        }

        // Drag to scroll logic
        let isDown = false, startY, scrollTop;

        contentDisplay.addEventListener('mousedown', (e) => {
            if(e.target.closest('.module-card') || e.target.tagName === 'IMG' || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
            isDown = true;
            startY = e.pageY - contentDisplay.offsetTop;
            scrollTop = contentDisplay.scrollTop;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.remove('allow-select');
        });

        contentDisplay.addEventListener('mouseleave', () => {
            isDown = false;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.add('allow-select');
        });

        contentDisplay.addEventListener('mouseup', () => {
            isDown = false;
            let noteSec = contentDisplay.querySelector('.note-section');
            if(noteSec) noteSec.classList.add('allow-select');
        });

        contentDisplay.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const y = e.pageY - contentDisplay.offsetTop;
            const walk = (y - startY) * 2; 
            contentDisplay.scrollTop = scrollTop - walk;
        });

        window.onload = initApp;
    </script>
</body>
</html>
